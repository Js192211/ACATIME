<!-- index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcadTime - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="main-container">
    <div class="login-panel">
        <div class="panel-header">
            <!-- Icono de gorra de graduación (Mortarboard) -->
            <svg class="grad-cap" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 1L2 6l10 5l10-5L12 1zm10 10v6l-10 5l-10-5v-6l10-5l10 5z"/>
                <path d="M22 6L12 11L2 6M12 21L2 16M22 16L12 21" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div class="brand-name">
                <span class="brand-acad">Acad</span><span class="brand-time">Time</span>
            </div>
            <h2>Iniciar sesión</h2>
        </div>

        <form>
            <div class="input-group">
                <label for="email"><i class="fas fa-user"></i></label>
                <input type="email" id="email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-group">
                <label for="password"><i class="fas fa-lock"></i></label>
                <input type="password" id="password" placeholder="Contraseña" required>
                <i class="fas fa-eye-slash eye-icon"></i>
            </div>

            <div class="options-group">
                <label class="checkbox-container">
                    <input type="checkbox" checked="checked">
                    <span class="checkmark"></span>
                    <span class="checkbox-label">Recordarme</span>
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-primary">
                Ingresar <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="separator">
            <span>o</span>
        </div>

        <button class="btn-secondary">
            <i class="fas fa-user-plus"></i> Crear una cuenta
        </button>

        <a href="#" class="back-link"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
    </div>
</div>

</body>
</html>
